name: Build and Push Django Docker Image - BXSC-682

on:
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: saikumarmusala
  IMAGE_NAME: django-app

jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the branch from which the workflow is run
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      # 4. Push Docker image to Docker Hub
      - name: Push Docker image
        run: |
          docker push \
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
